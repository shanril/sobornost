[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sobornost"
version = "0.1.0"
description = "EVE Online client preview & switcher"
requires-python = ">=3.9"
license = {text = "MIT"}
dynamic = ["dependencies"]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "setuptools<82",
    "py2app",
    "pytest",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.setuptools.packages.find]
include = ["sobornost*"]

[tool.pytest.ini_options]
# Tests run against the source tree and stub the native extension
# (see tests/conftest.py), so no compiled _native is required.
pythonpath = ["."]
testpaths = ["tests"]
